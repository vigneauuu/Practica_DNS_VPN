[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdns-lab"
version = "0.2.0"
description = "Mediciones reproducibles de DNS protector y evidencia de filtrado"
requires-python = ">=3.11"
dependencies = ["dnspython>=2.7,<3", "httpx[socks]>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
pdns-lab = "pdns_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
